name: Deploy Laravel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            cd /var/www/ulo

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Installing PHP dependencies..."
            composer install \
              --no-dev \
              --prefer-dist \
              --optimize-autoloader \
              --no-interaction

            echo "Installing JS dependencies..."
            pnpm install --frozen-lockfile

            echo "Generating Wayfinder routes..."
            php artisan wayfinder:generate

            echo "Building frontend..."
            pnpm build

            echo "Running migrations..."
            php artisan migrate --force

            echo "Clearing and rebuilding Laravel cache..."
            php artisan optimize:clear
            php artisan optimize

            echo "Restarting services..."
            sudo systemctl restart laravel-queue.service
            sudo systemctl restart laravel-scheduler.service
            sudo systemctl restart laravel-reverb.service

            echo "Deployment complete."